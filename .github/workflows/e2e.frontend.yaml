name: e2e:frontend
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Explain frontend E2E ownership
        run: |
          echo "Frontend E2E tests run in bricks-software/unleash-enterprise."
          echo "Frontend E2E tests run in bricks-software/unleash-enterprise against its OSS subtree. This compatibility check does not execute tests." >> "$GITHUB_STEP_SUMMARY"
